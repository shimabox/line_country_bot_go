<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Wikidataから国データ、Flagpediaから国旗画像をツールで取得し、Goのコードと画像としてリポジトリに置く。npm run buildでTinyGoによりwasmを作り、wrangler deployでCloudflare Workersに載せる。PRではGitHub Actionsがgo・tinygo-test・buildの3ジョブ（Goのテスト、TinyGoでのテスト、wasmビルドとサイズ確認）を並列に実行する。" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" color="#1b2420">
<title>Wikidataから国データ、Flagpediaから国旗画像をツールで取得し、Goのコードと画像としてリポジトリに置く。npm run buildでTinyGoによりwasmを作り、wrangler deployでCloudflare Workersに載せる。PRではGitHub Actionsがgo・tinygo-test・buildの3ジョブ（Goのテスト、TinyGoでのテスト、wasmビルドとサイズ確認）を並列に実行する。</title>
<rect width="960" height="300" fill="#ffffff"/>

          <defs>
            <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2420"/></marker>
          </defs>
          <g fill="#1b2420" font-size="11" text-anchor="middle">
            
            <rect x="16" y="30" width="120" height="50" rx="8" fill="none" stroke="#1b2420" stroke-dasharray="5 4"/>
            <text x="76" y="52" font-size="12" font-weight="700">Wikidata</text><text x="76" y="68" opacity=".75">SPARQL・CC0</text>
            <rect x="176" y="30" width="140" height="50" rx="8" fill="none" stroke="#1b2420"/>
            <text x="246" y="52" font-family="Menlo, Consolas, monospace">tools/gencountries</text><text x="246" y="68" opacity=".75">＋ overrides.json</text>
            <rect x="356" y="30" width="130" height="50" rx="8" fill="#ffffff" stroke="#1b2420"/>
            <text x="421" y="52" font-family="Menlo, Consolas, monospace">countries.json</text><text x="421" y="68" opacity=".75">正本（196件）</text>
            <rect x="526" y="30" width="140" height="50" rx="8" fill="none" stroke="#1b2420"/>
            <text x="596" y="52" font-family="Menlo, Consolas, monospace">tools/gencountrygo</text><text x="596" y="68" opacity=".75">go generate</text>
            <rect x="706" y="30" width="140" height="50" rx="8" fill="#ffffff" stroke="#1b2420"/>
            <text x="776" y="52" font-family="Menlo, Consolas, monospace">countries_gen.go</text><text x="776" y="68" opacity=".75">Go の表</text>

            
            <rect x="16" y="120" width="120" height="50" rx="8" fill="none" stroke="#1b2420" stroke-dasharray="5 4"/>
            <text x="76" y="142" font-size="12" font-weight="700">Flagpedia</text><text x="76" y="158" opacity=".75">flagcdn.com</text>
            <rect x="176" y="120" width="140" height="50" rx="8" fill="none" stroke="#1b2420"/>
            <text x="246" y="142" font-family="Menlo, Consolas, monospace">tools/fetchflags</text><text x="246" y="158" opacity=".75">取得と寸法・角の色</text>
            <rect x="356" y="120" width="130" height="50" rx="8" fill="#ffffff" stroke="#1b2420"/>
            <text x="421" y="142" font-family="Menlo, Consolas, monospace">public/flags/</text><text x="421" y="158" opacity=".75">PNG 196枚・288KB</text>
            <rect x="706" y="120" width="140" height="50" rx="8" fill="#ffffff" stroke="#1b2420"/>
            <text x="776" y="142" font-family="Menlo, Consolas, monospace">flags_gen.go</text><text x="776" y="158" opacity=".75">寸法と角の色</text>

            
            <rect x="310" y="220" width="216" height="56" rx="8" fill="none" stroke="#1b2420" stroke-width="1.5"/>
            <text x="418" y="243" font-family="Menlo, Consolas, monospace">npm run build</text><text x="418" y="260" opacity=".75">TinyGo → wasm（gzip 553 KiB）</text>
            <rect x="566" y="220" width="160" height="56" rx="8" fill="none" stroke="#1b2420" stroke-width="1.5"/>
            <text x="646" y="243" font-family="Menlo, Consolas, monospace">wrangler deploy</text><text x="646" y="260" opacity=".75">wasm と画像を配置</text>
            <rect x="776" y="220" width="168" height="56" rx="8" fill="#dff0e9" stroke="#0f7a5f" stroke-width="1.5"/>
            <text x="860" y="243" font-size="12" font-weight="700" fill="#0f7a5f">Cloudflare Workers</text><text x="860" y="260" opacity=".75">本番</text>

            <rect x="16" y="220" width="250" height="56" rx="8" fill="none" stroke="#1b2420" stroke-dasharray="5 4"/>
            <text x="141" y="243" font-size="12" font-weight="700">GitHub Actions（PR）</text><text x="141" y="260" opacity=".75">go・tinygo-test・build の 3 ジョブ並列</text>
          </g>
          <g stroke="#1b2420" stroke-width="1.5" fill="none">
            <line x1="136" y1="55" x2="174" y2="55" marker-end="url(#ar4)"/>
            <line x1="316" y1="55" x2="354" y2="55" marker-end="url(#ar4)"/>
            <line x1="486" y1="55" x2="524" y2="55" marker-end="url(#ar4)"/>
            <line x1="666" y1="55" x2="704" y2="55" marker-end="url(#ar4)"/>
            <line x1="136" y1="145" x2="174" y2="145" marker-end="url(#ar4)"/>
            <line x1="316" y1="145" x2="354" y2="145" marker-end="url(#ar4)"/>
            <path d="M316,160 L340,190 L690,190 L760,172" marker-end="url(#ar4)"/>
            <path d="M776,80 L776,100 L880,100 L880,200 L520,200 L500,218" marker-end="url(#ar4)"/>
            <path d="M421,170 L421,200 L600,200 L630,218" stroke-dasharray="4 3" marker-end="url(#ar4)"/>
            <line x1="526" y1="248" x2="564" y2="248" marker-end="url(#ar4)"/>
            <line x1="726" y1="248" x2="774" y2="248" marker-end="url(#ar4)"/>
          </g>
          <text x="520" y="186" font-size="11" fill="#1b2420" text-anchor="middle">寸法と角の色を書き出す</text>
          <text x="890" y="140" font-size="11" fill="#1b2420" transform="rotate(90 890 140)" text-anchor="middle">Go のコードとしてビルドへ</text>
        </svg>
