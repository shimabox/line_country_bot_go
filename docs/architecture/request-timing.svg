<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-label="Webhookを受けてから200を返すまで約1.16秒。そのうち約1秒は待機で、CPU時間に数えられるのは最初の処理の数十ミリ秒だけ。LINEのタイムアウト2秒まで余裕がある。" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" color="#1b2420">
<title>Webhookを受けてから200を返すまで約1.16秒。そのうち約1秒は待機で、CPU時間に数えられるのは最初の処理の数十ミリ秒だけ。LINEのタイムアウト2秒まで余裕がある。</title>
<rect width="960" height="230" fill="#ffffff"/>

          <defs>
            <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2420"/></marker>
          </defs>
          
          <line x1="140" y1="170" x2="910" y2="170" stroke="#1b2420" opacity=".5"/>
          <g font-size="11" fill="#1b2420" text-anchor="middle" font-family="Menlo, Consolas, monospace">
            <line x1="140" y1="170" x2="140" y2="176" stroke="#1b2420"/><text x="140" y="192">0</text>
            <line x1="330" y1="170" x2="330" y2="176" stroke="#1b2420"/><text x="330" y="192">500ms</text>
            <line x1="520" y1="170" x2="520" y2="176" stroke="#1b2420"/><text x="520" y="192">1000ms</text>
            <line x1="710" y1="170" x2="710" y2="176" stroke="#1b2420"/><text x="710" y="192">1500ms</text>
            <line x1="900" y1="170" x2="900" y2="176" stroke="#1b2420"/><text x="900" y="192">2000ms</text>
          </g>
          
          <g font-size="12" fill="#1b2420">
            <text x="20" y="44">検証・返答を決める</text>
            <text x="20" y="80">「…」を出す</text>
            <text x="20" y="116">待機</text>
            <text x="20" y="152">返信を送る</text>
          </g>
          
          <rect x="140" y="30" width="15" height="20" rx="3" fill="#0f7a5f"/>
          <text x="162" y="45" font-size="11" fill="#1b2420">数十ms（CPU時間はほぼここだけ）</text>
          
          <rect x="155" y="66" width="27" height="20" rx="3" fill="none" stroke="#1b2420" stroke-width="1.5"/>
          <text x="189" y="81" font-size="11" fill="#1b2420">通信</text>
          
          <rect x="182" y="102" width="380" height="20" rx="3" fill="none" stroke="#1b2420" stroke-dasharray="4 3"/>
          <text x="372" y="117" text-anchor="middle" font-size="11" fill="#1b2420">1000ms（REPLY_DELAY_MS、上限 1200ms）</text>
          
          <rect x="562" y="138" width="26" height="20" rx="3" fill="none" stroke="#1b2420" stroke-width="1.5"/>
          <text x="595" y="153" font-size="11" fill="#1b2420">通信 → 200 を返す（実測 中央値 1.16秒）</text>
          
          <line x1="900" y1="20" x2="900" y2="170" stroke="#b4441d" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="892" y="30" text-anchor="end" font-size="11" fill="#b4441d">LINE のタイムアウト（2秒）</text>
          
          <line x1="590" y1="20" x2="590" y2="170" stroke="#1b2420" opacity=".35"/>
        </svg>
