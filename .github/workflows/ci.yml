name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # TinyGo and Binaryen from their official releases, checked against the
      # SHA-256 in scripts/toolchain.env. The script does nothing when the
      # cached .tools already has the same versions.
      - name: Cache TinyGo and Binaryen
        uses: actions/cache@v5
        with:
          path: .tools
          key: tinygo-${{ runner.os }}-${{ hashFiles('scripts/toolchain.env') }}

      # TinyGo's build cache of the standard library (about 14 seconds to build
      # from scratch).
      - name: Cache TinyGo builds
        uses: actions/cache@v5
        with:
          path: ~/.cache/tinygo
          key: tinygo-cache-${{ runner.os }}-0.43.0-${{ hashFiles('go.sum') }}

      - name: Install TinyGo and Binaryen
        run: |
          bash scripts/install-tinygo.sh
          echo "$PWD/.tools/tinygo/bin" >> "$GITHUB_PATH"
          echo "$PWD/.tools/binaryen/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          tinygo version
          wasm-opt --version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go vet (js/wasm)
        run: GOOS=js GOARCH=wasm go vet ./...

      # TinyGo has no vet; the js/wasm go vet above still type-checks the code.
      # This runs the tests on the host to catch differences in TinyGo's
      # reflect and standard library (encoding/json and others).
      - name: tinygo test
        run: tinygo test ./internal/...

      # npm run build builds with TinyGo (scripts/build.sh).
      - name: Build
        run: |
          npm ci
          npm run build
          test -f build/app.wasm
          test -f build/worker.mjs
          test -f build/wasm_exec.js

      # wrangler deploy --dry-run; fails above 1024 KiB gzip so that a build
      # that falls back to Go (about 2,000 KiB) is caught. The limit is 3MB.
      - name: Script size
        run: bash scripts/check-size.sh 1024
